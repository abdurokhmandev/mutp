<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahifa topilmadi — MUTP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F8F8F7;
      font-family: 'Inter', sans-serif;
    }
    .error-code {
      font-size: 110px;
      font-weight: 800;
      line-height: 1;
      color: #16A34A;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
      animation: fadeInDown 0.6s ease;
    }
    .emoji-span {
      font-size: 80px;
      display: inline-block;
      animation: swing 2s ease-in-out infinite;
    }
    .error-title {
      font-size: 26px;
      font-weight: 700;
      color: #1A1A18;
      text-align: center;
    }
    @keyframes swing {
      0%, 100% { transform: rotate(-8deg); }
      50%       { transform: rotate(8deg); }
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div>
    <div class="error-code">
      <span>4</span>
      <span class="emoji-span">😕</span>
      <span>4</span>
    </div>
    <h2 class="error-title">Voy! Bu sahifa topilmadi</h2>
  </div>
</body>
</html>
