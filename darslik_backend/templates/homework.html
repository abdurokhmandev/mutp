<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uyga vazifa — MUTP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <style>
    body { background: var(--surface); min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Mini Navbar */
    .homework-nav { background: var(--ink); color: white; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .nav-left { display: flex; align-items: center; gap: 24px; }
    .back-btn { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 6px; transition: color 0.2s; }
    .back-btn:hover { color: white; }
    .course-title-nav { font-weight: 700; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; }

    /* Main Layout */
    .container { max-width: 800px; margin: 40px auto; padding: 0 20px; width: 100%; flex: 1; }
    .hw-card { background: var(--white); border: 1px solid var(--border); border-radius: 20px; padding: 40px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); }

    /* Header */
    .hw-header { border-bottom: 1px solid var(--border); padding-bottom: 24px; margin-bottom: 32px; }
    .hw-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px; color: var(--ink); margin-bottom: 12px; font-weight: 700; }
    .hw-meta { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }
    .badge { padding: 4px 12px; border-radius: 99px; font-weight: 600; font-size: 12px; }
    .badge.type-quiz { background: rgba(52, 152, 219, 0.1); color: var(--blue); }
    .badge.type-written { background: rgba(155, 89, 182, 0.1); color: var(--purple); }
    .badge.deadline { background: rgba(243, 156, 18, 0.1); color: var(--amber); }

    /* Description */
    .hw-description { font-size: 15px; color: var(--ink-2); line-height: 1.6; margin-bottom: 32px; }

    /* Quiz Styles */
    .hw-quiz-wrapper { display: flex; flex-direction: column; gap: 24px; }
    .quiz-question { padding: 24px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }
    .quiz-q-text { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--ink); }
    .quiz-options { display: flex; flex-direction: column; gap: 10px; }
    .quiz-option { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; background: var(--white); font-weight: 500; font-size: 14px; }
    .quiz-option:hover { border-color: var(--duo-green); background: var(--duo-green-bg); }
    .quiz-option.selected { border-color: var(--duo-green); background: var(--duo-green-bg); font-weight: 600; }
    .quiz-option input[type="radio"] { margin: 0; accent-color: var(--duo-green); }

    /* Written Styles */
    .hw-written-wrapper { display: flex; flex-direction: column; gap: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label { font-size: 14px; font-weight: 600; color: var(--ink); }
    textarea { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 16px; font-size: 14px; font-family: inherit; resize: vertical; outline: none; transition: border-color 0.2s; }
    textarea:focus { border-color: var(--duo-green); }

    .file-upload-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 32px; text-align: center; cursor: pointer; background: var(--surface); transition: all 0.2s; }
    .file-upload-zone:hover { border-color: var(--duo-green); background: var(--duo-green-bg); }
    .file-upload-zone span { font-size: 14px; color: var(--muted); font-weight: 500; }
    .file-preview { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); margin-top: 10px; }
    .file-preview-info { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: var(--ink); }
    .file-remove { cursor: pointer; color: var(--rose); font-size: 18px; }

    /* Result Card Styles */
    .hw-result-card { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 20px 0; }
    .hw-result-icon { font-size: 64px; }
    .hw-result-card h3 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 700; color: var(--ink); }
    .hw-result-card p { font-size: 14px; color: var(--muted); max-width: 480px; line-height: 1.5; }

    /* Score Ring */
    .score-ring { position: relative; width: 120px; height: 120px; margin: 16px 0; }
    .score-ring svg { width: 120px; height: 120px; }
    .score-ring span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; font-weight: 700; font-family: 'Plus Jakarta Sans', sans-serif; color: var(--ink); }

    .teacher-feedback-box { width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 24px; background: var(--surface); text-align: left; margin: 16px 0; }
    .teacher-feedback-box h4 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700; margin-bottom: 8px; color: var(--ink); }
    .teacher-feedback-box p { color: var(--ink-2); font-size: 14px; max-width: 100%; }

    .btn-hero { background: var(--duo-green); color: white; border: none; padding: 14px 28px; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform 0.1s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 0 var(--duo-green-dark); }
    .btn-hero:hover { background: var(--duo-green-dark); }
    .btn-secondary { background: var(--surface-2); color: var(--ink); border: 1px solid var(--border); padding: 14px 28px; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; text-align: center; transition: background 0.2s; }
    .btn-secondary:hover { background: var(--border); }
  </style>
</head>
<body>

  <!-- Mini Navbar -->
  <nav class="homework-nav">
    <div class="nav-left">
      <a href="javascript:history.back()" class="back-btn"><i class="ti ti-arrow-left"></i> Darsga qaytish</a>
      <div class="course-title-nav" id="courseTitle">Loading...</div>
    </div>
    <div class="nav-right">
      <div class="avatar-xs" style="width:32px;height:32px;font-size:14px;background:rgba(255,255,255,0.1);color:white;cursor:pointer;" id="userAvatar">ZM</div>
    </div>
  </nav>

  <div class="container">
    <div class="hw-card">
      <div id="hwMainContent">
        <!-- Header -->
        <div class="hw-header">
          <h1 class="hw-title" id="hwTitle">Loading...</h1>
          <div class="hw-meta">
            <span class="badge" id="hwTypeBadge">Yozma</span>
            <span class="badge deadline" id="hwDeadline">Muddat belgilanmagan</span>
          </div>
        </div>

        <!-- Description -->
        <div class="hw-description" id="hwDescription"></div>

        <!-- Dynamic Form Body (Quiz or Written) -->
        <div id="hwFormBody"></div>
      </div>

      <!-- Result Card (shown after submission) -->
      <div class="hw-result-card" id="hwResultCard" style="display:none">
        <div class="hw-result-icon" id="hwResultIcon">✅</div>
        <h3 id="hwResultTitle">Topshirildi!</h3>
        <p id="hwResultMessage"></p>

        <!-- Quiz Details -->
        <div id="hwQuizScore" style="display:none">
          <div class="score-ring">
            <svg viewBox="0 0 80 80">
              <circle cx="40" cy="40" r="34" fill="none" stroke="var(--border)" stroke-width="6"/>
              <circle cx="40" cy="40" r="34" fill="none" stroke="var(--green)" stroke-width="6"
                      id="scoreRingCircle"
                      stroke-dasharray="213.6"
                      stroke-dashoffset="213.6"
                      stroke-linecap="round" transform="rotate(-90 40 40)"/>
            </svg>
            <span id="scorePercent">0%</span>
          </div>
          <p id="scoreLabel"></p>
        </div>

        <!-- Written Pending -->
        <div id="hwWrittenPending" style="display:none; width: 100%;">
          <div class="teacher-feedback-box" style="text-align: center;">
            <p>✅ Vazifangiz ustozga yuborildi. Ustoz tekshirib, izoh va ball qo'yadi.</p>
          </div>
        </div>

        <!-- Teacher Feedback -->
        <div id="hwTeacherFeedback" style="display:none; width: 100%;">
          <div class="teacher-feedback-box">
            <h4>Ustoz izohi:</h4>
            <p id="feedbackText" style="margin-bottom: 12px;"></p>
            <p>Ball: <strong id="feedbackScore"></strong></p>
          </div>
        </div>

        <a href="javascript:history.back()" class="btn-secondary">← Darsga qaytish</a>
      </div>
    </div>
  </div>

  <script src="/assets/js/toast.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/animations.js"></script>
  <script src="/assets/js/homework.js"></script>
</body>
</html>
