<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat — MUTP</title>
  <meta name="description" content="MUTP platformasi — ustoz va o'quvchilar o'rtasidagi chat">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F8F8F7;
      --surface: #FFFFFF;
      --border: rgba(0,0,0,0.08);
      --border-md: rgba(0,0,0,0.12);
      --text: #1F2937;
      --text-2: #4B5563;
      --text-3: #9CA3AF;
      --purple: #2563EB;
      --purple-light: #EFF6FF;
      --green: #16A34A;
      --green-light: #F0FDF4;
      --duo-green: #2563EB;
      --duo-green-dark: #1D4ED8;
      --duo-green-bg: #EFF6FF;
      --amber: #D97706;
      --amber-light: #FFFBEB;
    }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
    h1, h2, h3, h4, h5, h6 { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; }

    /* Layout */
    .chat-app { display: flex; height: 100vh; }

    /* Sidebar */
    .chat-sidebar { width: 300px; background: var(--surface); border-right: 2px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .chat-sidebar-head { padding: 16px 20px; border-bottom: 2px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .chat-sidebar-title { font-size: 15px; font-weight: 700; }
    .btn-back { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--text-2); text-decoration: none; border: 2px solid var(--border-md); border-radius: 10px; padding: 6px 10px; transition: background .15s; height: 32px; background: transparent; }
    .btn-back:hover { background: var(--bg); color: var(--text); }
    
    /* Tabs Navigation */
    .chat-tabs { display: flex; border-bottom: 2px solid var(--border); background: var(--surface); }
    .chat-tab-btn { flex: 1; padding: 12px; border: none; background: transparent; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--text-2); border-bottom: 2px solid transparent; transition: all 0.2s; text-align: center; }
    .chat-tab-btn:hover { background: var(--bg); }
    .chat-tab-btn.active { color: var(--purple) !important; border-bottom-color: var(--purple) !important; background: var(--purple-light); }

    .conv-search { padding: 12px 16px; border-bottom: 2px solid var(--border); }
    .conv-search input { width: 100%; padding: 8px 12px; border: 2px solid var(--border); border-radius: 12px; font-size: 13px; background: var(--bg); outline: none; transition: border .15s; }
    .conv-search input:focus { border-color: var(--purple); }
    .conv-list { flex: 1; overflow-y: auto; }
    .conv-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background .15s; position: relative; }
    .conv-item:hover { background: var(--bg); }
    .conv-item.active { background: var(--purple-light); }
    .conv-av { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; background: var(--purple-light); color: var(--purple); overflow: hidden; }
    .conv-av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .conv-info { flex: 1; min-width: 0; }
    .conv-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-last { font-size: 11px; color: var(--text-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-badge { background: #EF4444; color: #fff; border-radius: 99px; font-size: 10px; font-weight: 700; padding: 2px 6px; flex-shrink: 0; }
    .conv-empty { padding: 32px 20px; text-align: center; color: var(--text-2); font-size: 13px; }

    /* Main chat area */
    .chat-main { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; }
    .chat-header { background: var(--surface); border-bottom: 2px solid var(--border); padding: 0 20px; height: 56px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .chat-header-av { width: 36px; height: 36px; border-radius: 50%; background: var(--purple-light); color: var(--purple); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; overflow: hidden; cursor: pointer; }
    .chat-header-av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .chat-header-name { font-size: 15px; font-weight: 700; cursor: pointer; }
    .chat-header-role { font-size: 11px; color: var(--text-2); margin-top: 1px; }
    .chat-placeholder { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--text-2); }
    .chat-placeholder i { font-size: 48px; opacity: .3; }
    .chat-placeholder p { font-size: 14px; }

    /* Messages */
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { display: flex; align-items: flex-end; gap: 8px; animation: msgIn .2s ease; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .msg.mine { flex-direction: row-reverse; }
    .msg-av { width: 28px; height: 28px; border-radius: 50%; background: var(--purple-light); color: var(--purple); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; flex-shrink: 0; overflow: hidden; cursor: pointer; }
    .msg-av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .msg-bubble { max-width: 65%; padding: 10px 14px; border-radius: 16px; font-size: 13px; line-height: 1.5; cursor: pointer; position: relative; }
    .msg.theirs .msg-bubble { background: var(--surface); border: 2px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.mine .msg-bubble { background: var(--purple); color: #fff; border-bottom-right-radius: 4px; }
    .msg-time { font-size: 10px; color: var(--text-3); margin-top: 4px; text-align: right; }
    .msg.theirs .msg-time { color: var(--text-2); text-align: left; }
    .msg.mine .msg-time { color: rgba(255, 255, 255, 0.7); }

    /* Input */
    .chat-input-bar { background: var(--surface); border-top: 2px solid var(--border); padding: 14px 20px; display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
    .chat-input-bar textarea { flex: 1; border: 2px solid var(--border); border-radius: 14px; padding: 10px 14px; font-size: 13px; font-family: inherit; resize: none; outline: none; max-height: 120px; overflow-y: auto; transition: border .15s; background: var(--bg); }
    .chat-input-bar textarea:focus { border-color: var(--purple); }
    .btn-send { background: var(--duo-green); color: #fff; border: none; border-radius: 14px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; box-shadow: 0 4px 0 var(--duo-green-dark); transition: transform .1s, box-shadow .1s; flex-shrink: 0; }
    .btn-send:hover { background: var(--duo-green-dark); transform: translateY(2px); box-shadow: 0 2px 0 var(--duo-green-dark); }
    .btn-send:disabled { opacity: .5; cursor: not-allowed; }

    /* Loading */
    .loading-dots { display: flex; gap: 4px; align-items: center; padding: 16px 20px; }
    .loading-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--purple); animation: bounce .8s infinite; }
    .loading-dots span:nth-child(2) { animation-delay: .15s; }
    .loading-dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

    /* Toast */
    #toast-container { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }

    /* Context Menu option styling */
    .menu-item { display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 13px; cursor: pointer; transition: background 0.15s; }
    .menu-item:hover { background: var(--bg); }
    .menu-item.danger { color: #DC2626; }

    /* Poll Option styles */
    .poll-option-row { position: relative; border: 1.5px solid var(--border); border-radius: 10px; padding: 8px 12px; margin-top: 6px; cursor: pointer; overflow: hidden; background: transparent; transition: all 0.2s; }
    .poll-option-row:hover { background: rgba(0, 0, 0, 0.02); }
    .poll-option-progress { position: absolute; left: 0; top: 0; bottom: 0; background: var(--purple-light); z-index: 1; transition: width 0.3s; }
    .poll-option-content { position: relative; z-index: 2; display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 500; }
    .poll-option-row.voted { border-color: var(--purple); }
    .poll-option-row.voted .poll-option-progress { background: #DDBEFE; }

    /* Shared Media lists */
    .shared-media-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .shared-media-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; cursor: pointer; }
    .shared-media-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .shared-media-item { display: flex; align-items: center; gap: 8px; font-size: 12px; text-decoration: none; color: var(--text-2); background: var(--bg); padding: 8px 10px; border-radius: 8px; }

    @media (max-width: 700px) {
      .chat-sidebar { width: 100%; position: absolute; z-index: 10; height: 100%; transform: translateX(0); transition: transform .25s; }
      .chat-sidebar.hidden { transform: translateX(-100%); }
      .chat-main { width: 100%; }
      .mobile-only { display: flex !important; }
      .chat-placeholder { display: none !important; }
    }
  </style>
</head>
<body>
<div id="toast-container"></div>
<div class="chat-app">

  <!-- Sidebar: Suhbatlar -->
  <aside class="chat-sidebar" id="chatSidebar">
    <div class="chat-sidebar-head">
      <span class="chat-sidebar-title">💬 Xabarlar</span>
      <div style="display:flex; gap:6px;">
        <button onclick="ChatApp.openCreateGroupModal()" class="btn-back" style="cursor:pointer; border-color:var(--purple); color:var(--purple);"><i class="ti ti-plus"></i> Guruh</button>
        <a href="/dashboard-student.html" id="exitHomeBtn" class="btn-back" title="Bosh sahifa"><i class="ti ti-home"></i></a>
        <a href="javascript:history.back()" class="btn-back"><i class="ti ti-arrow-left"></i></a>
      </div>
    </div>
    
    <!-- Tab Navigation -->
    <div class="chat-tabs">
      <button class="chat-tab-btn active" id="tabDirect" onclick="ChatApp.switchTab('direct')">Shaxsiy</button>
      <button class="chat-tab-btn" id="tabGroup" onclick="ChatApp.switchTab('group')">Guruhlar</button>
    </div>

    <div class="conv-search">
      <input id="convSearch" type="text" placeholder="Qidirish..." oninput="ChatApp.filterConvs(this.value)">
    </div>
    <div class="conv-list" id="convList">
      <div class="conv-empty">Yuklanmoqda...</div>
    </div>
  </aside>

  <!-- Main -->
  <div class="chat-main" id="chatMain">

    <!-- Placeholder (hech qaysi suhbat tanlanmagan) -->
    <div class="chat-placeholder" id="chatPlaceholder">
      <i class="ti ti-messages"></i>
      <p>Suhbat tanlang</p>
    </div>

    <!-- Active conversation -->
    <div id="chatActive" style="display:none; flex-direction:column; height:100%;">
      <div class="chat-header" id="chatHeader">
        <!-- Back button for mobile view -->
        <button onclick="document.getElementById('chatSidebar').classList.remove('hidden'); document.getElementById('chatPlaceholder').style.display='flex'; document.getElementById('chatActive').style.display='none';" class="btn-back mobile-only" style="border:none; font-size:18px; cursor:pointer; display:none;" title="Orqaga"><i class="ti ti-arrow-left"></i></button>

        <div class="chat-header-av" id="headerAv" onclick="ChatApp.openGroupSettings()">?</div>
        <div style="flex:1; cursor:pointer;" onclick="ChatApp.openGroupSettings()">
          <div class="chat-header-name" id="headerName">—</div>
          <div class="chat-header-role" id="headerRole"></div>
        </div>
        
        <!-- Header action buttons -->
        <button onclick="ChatApp.toggleMessageSearch()" class="btn-back" style="border:none; font-size:18px; cursor:pointer; margin-right:8px;" title="Qidiruv"><i class="ti ti-search"></i></button>
        <button id="groupSettingsBtn" onclick="ChatApp.openGroupSettings()" class="btn-back" style="display:none; border:none; font-size:18px; cursor:pointer;"><i class="ti ti-settings"></i></button>
      </div>

      <!-- Sticky Pinned Message Banner -->
      <div id="pinBanner" style="display:none; background:#EFF6FF; border-bottom:1px solid var(--border); padding:8px 20px; align-items:center; justify-content:space-between; font-size:12px; flex-shrink:0;">
        <div style="flex:1; cursor:pointer; min-width:0;" onclick="ChatApp.scrollToPinnedMessage()">
          <span style="color:var(--purple); font-weight:700;">📌 Qadalgan xabar:</span>
          <span id="pinText" style="margin-left:4px; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:inline-block; max-width:70%; vertical-align:bottom;"></span>
        </div>
        <button onclick="ChatApp.unpinActiveMessage()" style="background:transparent; border:none; color:var(--text-3); cursor:pointer; font-size:14px;"><i class="ti ti-x"></i></button>
      </div>

      <!-- Message Search Bar -->
      <div id="messageSearchInputBar" style="display:none; background:var(--surface); border-bottom:1px solid var(--border); padding:8px 20px; align-items:center; gap:10px; flex-shrink:0;">
        <input id="searchMsgInput" type="text" placeholder="Xabarlarni qidirish..." oninput="ChatApp.searchMessages(this.value)" style="flex:1; padding:6px 12px; border:2px solid var(--border); border-radius:10px; font-size:12px; outline:none; background:var(--bg);">
        <button onclick="ChatApp.closeMessageSearch()" style="background:transparent; border:none; color:#DC2626; cursor:pointer;"><i class="ti ti-x"></i></button>
      </div>
      
      <div class="chat-messages" id="chatMessages"></div>
      
      <!-- Edit message mode bar -->
      <div id="editModeBar" style="display:none; background:#EFF6FF; border-top:1px solid var(--border); padding:8px 16px; font-size:12px; align-items:center; justify-content:space-between; color:var(--purple); flex-shrink:0;">
        <span style="display:flex; align-items:center; gap:4px;"><i class="ti ti-edit"></i> Xabarni tahrirlash: <strong id="editingTextPreview" style="margin-left:4px; font-weight:500;"></strong></span>
        <button onclick="ChatApp.cancelEditMode()" style="background:transparent; border:none; color:#DC2626; cursor:pointer;"><i class="ti ti-x"></i></button>
      </div>

      <!-- Upload preview area -->
      <div id="uploadPreview" style="display:none; background:#E2E8F0; padding:8px 16px; font-size:12px; align-items:center; justify-content:space-between; border-top:1px solid var(--border); flex-shrink:0;">
        <span id="previewFileName"></span>
        <button onclick="ChatApp.clearSelectedFile()" style="background:transparent; border:none; color:#DC2626; cursor:pointer;"><i class="ti ti-x"></i></button>
      </div>

      <!-- Input bar -->
      <div class="chat-input-bar">
        <!-- Attachment button -->
        <button onclick="document.getElementById('fileInput').click()" class="btn-send" style="background:#E2E8F0; color:#4A5568; box-shadow:none; margin-right:4px;" title="Fayl yuklash">
          <i class="ti ti-paperclip"></i>
        </button>
        <input type="file" id="fileInput" style="display:none;" onchange="ChatApp.handleFileUpload(event)">

        <!-- Poll button -->
        <button id="pollBtn" onclick="ChatApp.openCreatePollModal()" class="btn-send" style="background:#E2E8F0; color:#4A5568; box-shadow:none; margin-right:4px; display:none;" title="So'rovnoma">
          <i class="ti ti-chart-bar"></i>
        </button>

        <!-- Voice message button -->
        <button id="micBtn" onclick="ChatApp.toggleVoiceRecord()" class="btn-send" style="background:#E2E8F0; color:#4A5568; box-shadow:none; margin-right:4px;" title="Ovozli xabar">
          <i class="ti ti-microphone"></i>
        </button>

        <textarea id="msgInput" rows="1" placeholder="Xabar yozing..." oninput="ChatApp.handleInputKeyPress()" onkeydown="ChatApp.handleKey(event)"></textarea>
        <button class="btn-send" id="sendBtn" onclick="ChatApp.sendMessage()" title="Yuborish">
          <i class="ti ti-send"></i>
        </button>
      </div>
    </div>

  </div>

  <!-- Thread Panel -->
  <aside class="chat-thread" id="threadPanel" style="width:350px; border-left:2px solid var(--border); background:white; display:none; flex-direction:column; z-index:5;">
    <div class="chat-sidebar-head" style="height:56px; border-bottom:2px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 16px; flex-shrink:0;">
      <span style="font-weight:700; font-size:14px;">Muhokama (Thread)</span>
      <button onclick="ChatApp.closeThread()" class="btn-back" style="cursor:pointer; padding:2px 6px;"><i class="ti ti-x"></i></button>
    </div>
    <div style="flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px;" id="threadContent">
      <!-- Parent message & replies list -->
    </div>
    <div class="chat-input-bar" style="padding:10px 16px; border-top:1px solid var(--border); flex-shrink:0;">
      <textarea id="threadMsgInput" rows="1" placeholder="Javob yozish..." oninput="ChatApp.autoResize(this)" onkeydown="ChatApp.handleThreadKey(event)" style="font-size:12px;"></textarea>
      <button class="btn-send" id="threadSendBtn" onclick="ChatApp.sendThreadMessage()" style="width:36px; height:36px; font-size:14px; box-shadow:none; flex-shrink:0;"><i class="ti ti-send"></i></button>
    </div>
  </aside>

</div>

<!-- Telegram-like Floating Message Context Menu -->
<div id="messageContextMenu" style="display:none; position:fixed; z-index:1000; background:white; border:1px solid var(--border); border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.15); width:180px; padding:6px 0; font-family:inherit;">
  <!-- Reactions inline -->
  <div style="display:flex; justify-content:space-around; padding:8px 12px; border-bottom:1px solid var(--border); font-size:18px;" id="menuReactions">
    <span onclick="ChatApp.triggerMenuAction('react', '👍')" style="cursor:pointer; transition:transform 0.1s;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='none'">👍</span>
    <span onclick="ChatApp.triggerMenuAction('react', '❤️')" style="cursor:pointer; transition:transform 0.1s;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='none'">❤️</span>
    <span onclick="ChatApp.triggerMenuAction('react', '😂')" style="cursor:pointer; transition:transform 0.1s;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='none'">😂</span>
    <span onclick="ChatApp.triggerMenuAction('react', '🔥')" style="cursor:pointer; transition:transform 0.1s;" onmouseover="this.style.transform='scale(1.2)'" onmouseout="this.style.transform='none'">🔥</span>
  </div>
  <div class="menu-item" onclick="ChatApp.triggerMenuAction('reply')"><i class="ti ti-arrow-back-up"></i> Javob yozish</div>
  <div class="menu-item" id="menuPinOpt" onclick="ChatApp.triggerMenuAction('pin')"><i class="ti ti-pin"></i> Qadash (Pin)</div>
  <div class="menu-item mine-only" id="menuEditOpt" onclick="ChatApp.triggerMenuAction('edit')"><i class="ti ti-edit"></i> Tahrirlash</div>
  <div class="menu-item mine-only" id="menuDeleteOpt" onclick="ChatApp.triggerMenuAction('delete')" style="color:#DC2626;"><i class="ti ti-trash"></i> O'chirish</div>
</div>

<!-- Group Creation Modal -->
<div id="groupModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:100; align-items:center; justify-content:center; font-family:'Plus Jakarta Sans', sans-serif;">
  <div style="background:white; border-radius:16px; padding:24px; width:100%; max-width:400px; box-shadow:0 10px 25px rgba(0,0,0,0.1);">
    <h3 style="font-size:16px; font-weight:700; margin-bottom:16px;">Yangi guruh kanali</h3>
    <div style="margin-bottom:12px;">
      <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Guruh nomi</label>
      <input id="gName" type="text" placeholder="Masalan: Python Guruh" style="width:100%; padding:10px 14px; border:2px solid var(--border); border-radius:12px; font-size:13px; outline:none; background:var(--bg);">
    </div>
    <div style="margin-bottom:16px;">
      <label style="font-size:12px; font-weight:700; display:block; margin-bottom:4px;">Tavsif (ixtiyoriy)</label>
      <textarea id="gDesc" placeholder="Guruh haqida qisqacha..." rows="3" style="width:100%; padding:10px 14px; border:2px solid var(--border); border-radius:12px; font-size:13px; resize:none; outline:none; font-family:inherit; background:var(--bg);"></textarea>
    </div>
    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button onclick="document.getElementById('groupModal').style.display='none'" class="btn-secondary" style="padding:8px 14px; border-radius:10px; font-size:12px; font-weight:600; cursor:pointer; background:#f3f4f6; border:none; color:#374151;">Bekor qilish</button>
      <button onclick="ChatApp.createGroup()" class="btn-primary" style="padding:8px 16px; border-radius:10px; font-size:12px; font-weight:600; cursor:pointer; background:var(--duo-green); border:none; color:white; box-shadow:0 3px 0 var(--duo-green-dark);">Yaratish</button>
    </div>
  </div>
</div>

<!-- Group Settings Modal -->
<div id="groupSettingsModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:200; align-items:center; justify-content:center; font-family:'Plus Jakarta Sans', sans-serif;">
  <div style="background:white; border-radius:20px; padding:24px; width:100%; max-width:480px; box-shadow:0 15px 35px rgba(0,0,0,0.15); display:flex; flex-direction:column; max-height:85vh;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-shrink:0;">
      <h3 style="font-size:16px; font-weight:700;">Guruh sozlamalari</h3>
      <button onclick="document.getElementById('groupSettingsModal').style.display='none'" style="background:transparent; border:none; font-size:20px; cursor:pointer; color:var(--text-2);"><i class="ti ti-x"></i></button>
    </div>
    
    <!-- Tab toggles within Settings -->
    <div style="display:flex; border-bottom:1px solid var(--border); margin-bottom:16px; flex-shrink:0;">
      <button class="chat-tab-btn active" id="settingsTabMembersBtn" onclick="ChatApp.switchSettingsTab('members')">A'zolar</button>

      <hr style="border:none; border-top:1px solid var(--border);">
      
      <div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <h4 style="font-size:13px; font-weight:700;">A'zolar</h4>
          <button id="addMemberToggleBtn" onclick="ChatApp.showAddMemberForm(true)" class="btn-back" style="padding:4px 8px; font-size:11px; color:var(--purple); border-color:var(--purple); cursor:pointer;"><i class="ti ti-plus"></i> Qo'shish</button>
        </div>
        
        <div id="addMemberSection" style="display:none; background:var(--bg); border-radius:12px; padding:12px; margin-bottom:12px;">
          <div style="display:flex; gap:8px;">
            <input id="memberSearchInput" type="text" placeholder="Qidirish (ism, email)..." oninput="ChatApp.searchUsersToAdd(this.value)" style="flex:1; padding:8px 12px; border:2px solid var(--border); border-radius:10px; font-size:12px; outline:none; background:white;">
            <button onclick="ChatApp.showAddMemberForm(false)" style="background:transparent; border:none; color:#DC2626; cursor:pointer;"><i class="ti ti-x"></i></button>

      <div id="sharedMediaFiles" class="shared-media-list"></div>
      
      <h4 style="font-size:13px; font-weight:700; margin-top:20px; margin-bottom:10px;">Havolalar (Linklar)</h4>
      <div id="sharedMediaLinks" class="shared-media-list"></div>

    <!-- Danger zone / Delete group -->

      <input class="poll-opt-input" type="text" placeholder="2-variant" style="width:100%; padding:10px; border:2px solid var(--border); border-radius:10px; font-size:12px; outline:none; background:var(--bg);">

    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button onclick="document.getElementById('pollModal').style.display='none'" class="btn-secondary" style="padding:8px 14px; border-radius:10px; font-size:12px; font-weight:600; cursor:pointer; background:#f3f4f6; border:none;">Bekor qilish</button>
      <button onclick="ChatApp.submitPoll()" class="btn-primary" style="padding:8px 16px; border-radius:10px; font-size:12px; font-weight:600; cursor:pointer; background:var(--duo-green); border:none; color:white;">Yuborish</button>

<script src="/assets/js/toast.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/animations.js"></script>
<script>
const ChatApp = {
  conversations: [],
  activeConvId: null,
  pollTimer: null,
  currentUser: null,
  currentTab: 'direct',
  selectedFile: null,
  activeThreadParentId: null,
  
  contextMenuTargetMsgId: null,
  contextMenuTargetMsgText: '',
  editingMsgId: null,

  // Voice recording state
  mediaRecorder: null,
  audioChunks: [],
  isRecording: false,
  recordTimer: null,
  recordDuration: 0,

  // Typing cooldown
  lastTypingSent: 0,
  searchQuery: '',

  async init() {
    if (!App.requireAuth(['teacher', 'student'])) return;
    App.updateNav();
    this.currentUser = App.getUser();
    
    const homeBtn = document.getElementById('exitHomeBtn');
    if (homeBtn && this.currentUser?.role) {
      homeBtn.href = App.dashboardUrl(this.currentUser.role);
    }

    if (Notification.permission === 'default') {
      Notification.requestPermission();
    }

    await this.loadConversations();
    
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('messageContextMenu');
      if (menu && !menu.contains(e.target)) {
        menu.style.display = 'none';
      }
    });

    const params = new URLSearchParams(location.search);
    if (params.get('conv')) this.openConv(parseInt(params.get('conv')));
    else if (params.get('channel')) this.openConv(parseInt(params.get('channel')));
    else if (params.get('user')) await this.startOrOpenConv(parseInt(params.get('user')));
  },

  switchTab(tab) {
    this.currentTab = tab;
    document.getElementById('tabDirect').classList.toggle('active', tab === 'direct');
    document.getElementById('tabGroup').classList.toggle('active', tab === 'group');
    this.renderConvList(this.conversations);
  },

  async loadConversations() {
    try {
      const res = await API.get('/chat/channels/');
      this.conversations = res.data || [];
      this.renderConvList(this.conversations);
    } catch (e) {
      document.getElementById('convList').innerHTML = `<div class="conv-empty">Yuklanmadi: ${e.message}</div>`;
    }
  },

  renderConvList(convs) {
    const el = document.getElementById('convList');
    
    const filtered = convs.filter(c => {
      if (this.currentTab === 'direct') {
        return c.channel_type === 'direct';
      } else {
        return c.channel_type === 'course' || c.channel_type === 'custom';
      }
    });

    if (!filtered.length) {
      el.innerHTML = '<div class="conv-empty">Hali suhbatlar yo\'q</div>';
      return;
    }

    el.innerHTML = filtered.map(c => {
      const isDirect = c.channel_type === 'direct';
      const displayName = isDirect ? (c.other_user?.full_name || 'Shaxsiy chat') : c.name;
      
      let avatarHtml = '';
      if (isDirect && c.other_user?.avatar) {
        avatarHtml = `<img src="${c.other_user.avatar}">`;
      } else if (!isDirect && c.image) {
        avatarHtml = `<img src="${c.image}">`;
      } else {
        avatarHtml = this.initials(displayName);
      }

      let typingLabel = '';
      if (c.typing_users && c.typing_users.length > 0) {
        typingLabel = `<span style="color:var(--green); font-weight:600;">yozmoqda...</span>`;
      }

      const lastMsg = c.last_message?.text || '';
      const unread = c.unread_count || 0;
      return `
        <div class="conv-item ${this.activeConvId === c.id ? 'active' : ''}" id="conv-${c.id}" onclick="ChatApp.openConv(${c.id})">
          <div class="conv-av">${avatarHtml}</div>
          <div class="conv-info">
            <div class="conv-name">${displayName}</div>
            <div class="conv-last">${typingLabel || (lastMsg ? (lastMsg.length > 35 ? lastMsg.slice(0, 35) + '…' : lastMsg) : 'Hali xabar yo\'q')}</div>
          </div>
          ${unread ? `<span class="conv-badge">${unread}</span>` : ''}
        </div>`;
    }).join('');
  },

  filterConvs(q) {
    const filtered = this.conversations.filter(c => {
      const isDirect = c.channel_type === 'direct';
      const displayName = isDirect ? (c.other_user?.full_name || '') : c.name;
      return displayName.toLowerCase().includes(q.toLowerCase());
    });
    this.renderConvList(filtered);
  },

  async openConv(convId) {
    this.activeConvId = convId;
    document.getElementById('chatPlaceholder').style.display = 'none';
    const activeEl = document.getElementById('chatActive');
    activeEl.style.display = 'flex';

    if (window.innerWidth <= 700) {
      document.getElementById('chatSidebar').classList.add('hidden');
    }

    document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
    const convEl = document.getElementById(`conv-${convId}`);
    if (convEl) convEl.classList.add('active');

    // Close search & editing modes
    this.closeMessageSearch();
    this.cancelEditMode();

    const conv = this.conversations.find(c => c.id === convId);
    if (conv) {
      const isDirect = conv.channel_type === 'direct';
      const displayName = isDirect ? (conv.other_user?.full_name || 'Shaxsiy chat') : conv.name;
      
      let avatarHtml = '';
      if (isDirect && conv.other_user?.avatar) {
        avatarHtml = `<img src="${conv.other_user.avatar}">`;
      } else if (!isDirect && conv.image) {
        avatarHtml = `<img src="${conv.image}">`;
      } else {
        avatarHtml = this.initials(displayName);
      }
      
      document.getElementById('headerAv').innerHTML = avatarHtml;
      document.getElementById('headerName').textContent = displayName;
      document.getElementById('headerRole').textContent = isDirect ? (conv.other_user?.role === 'teacher' ? 'Ustoz' : "O'quvchi") : "Guruh";
      
      // Toggle poll button: only in groups
      document.getElementById('pollBtn').style.display = (!isDirect) ? 'block' : 'none';

      const settingsBtn = document.getElementById('groupSettingsBtn');
      if (settingsBtn) {
        settingsBtn.style.display = (!isDirect) ? 'block' : 'none';
      }

      // Handle Pin Banner on load
      this.updatePinnedBanner(conv.pinned_message);
    }

    await this.loadMessages();
    clearInterval(this.pollTimer);
    this.pollTimer = setInterval(() => this.pollMessages(), 3000);
  },

  updatePinnedBanner(pinnedMsg) {
    const banner = document.getElementById('pinBanner');
    const pText = document.getElementById('pinText');
    if (pinnedMsg) {
      pText.textContent = pinnedMsg.message_type === 'poll' ? "📊 So'rovnoma" : pinnedMsg.text;
      banner.style.display = 'flex';
      banner.dataset.msgId = pinnedMsg.id;
    } else {
      banner.style.display = 'none';
    }
  },

  scrollToPinnedMessage() {
    const banner = document.getElementById('pinBanner');
    const msgId = banner.dataset.msgId;
    if (msgId) {
      const target = document.getElementById(`msg-${msgId}`);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        target.style.background = '#EFF6FF';
        setTimeout(() => target.style.background = 'transparent', 2000);
      } else {
        window.toast?.show("Xabar topilmadi", 'info');
      }
    }
  },

  async unpinActiveMessage() {
    if (!confirm("Xabarni pin'dan olib tashlamoqchimisiz?")) return;
    try {
      await API.post(`/chat/channels/${this.activeConvId}/pin/`, {});
      document.getElementById('pinBanner').style.display = 'none';
      await this.loadConversations();
    } catch(e) {
      window.toast?.show(e.message, 'error');
    }
  },

  async startOrOpenConv(userId) {
    try {
      const res = await API.post(`/chat/direct/${userId}/`, {});
      const channelId = res.data?.channel_id;
      if (channelId) {
        await this.loadConversations();
        this.openConv(channelId);
      }
    } catch (e) {
      window.toast?.show(e.message || 'Xatolik', 'error');
    }
  },

  async loadMessages() {
    if (!this.activeConvId) return;
    const el = document.getElementById('chatMessages');
    el.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
    try {
      const url = this.searchQuery 
        ? `/chat/channels/${this.activeConvId}/messages/?q=${encodeURIComponent(this.searchQuery)}`
        : `/chat/channels/${this.activeConvId}/messages/`;
      const res = await API.get(url);
      this.renderMessages(res.data || []);
    } catch (e) {
      el.innerHTML = `<div style="padding:20px;color:var(--text-2)">Yuklanmadi: ${e.message}</div>`;
    }
  },

  lastMsgCount: 0,
  async pollMessages() {
    if (!this.activeConvId) return;
    try {
      const res = await API.get(`/chat/channels/${this.activeConvId}/messages/`);
      const msgs = res.data || [];
      const banner = document.getElementById('connLossBanner');
      if (banner) banner.style.display = 'none';
      if (msgs.length !== this.lastMsgCount && !this.searchQuery) {
        if (msgs.length > this.lastMsgCount) {
          const lastMsg = msgs[msgs.length - 1];
          if (lastMsg.sender_id !== this.currentUser?.id) {
            this.showPushNotification(lastMsg.sender_name, lastMsg.text);
          }
        }
        this.renderMessages(msgs);
      }

      // Check for Pinned message & Typing indicator updates on polling
      const convRes = await API.get('/chat/channels/');
      this.conversations = convRes.data || [];
      this.renderConvList(this.conversations);

      const activeChannel = this.conversations.find(c => c.id === this.activeConvId);
      if (activeChannel) {
        this.updatePinnedBanner(activeChannel.pinned_message);
        
        // Render typing indicator
        const subHeaderRole = document.getElementById('headerRole');
        if (activeChannel.typing_users && activeChannel.typing_users.length > 0) {
          subHeaderRole.innerHTML = `<span style="color:var(--green); font-weight:600;">✍️ ${activeChannel.typing_users.map(u => u.full_name).join(', ')} yozmoqda...</span>`;
        } else {
          subHeaderRole.textContent = activeChannel.channel_type === 'direct' ? (activeChannel.other_user?.role === 'teacher' ? 'Ustoz' : "O'quvchi") : "Guruh";
        }
      }
    } catch (e) {
      const banner = document.getElementById('connLossBanner');
      if (banner) banner.style.display = 'flex';
    }
  },

  showPushNotification(sender, text) {
    if (Notification.permission === 'granted' && document.hidden) {
      new Notification(`MUTP Chat: ${sender}`, {
        body: text,
        icon: '/assets/images/logo.png'
      });
    } else if (!document.hidden) {
      window.toast?.show(`Yangi xabar: ${sender} - ${text.slice(0, 30)}...`, 'info');
    }
  },

  // Message Search Toggle
  toggleMessageSearch() {
    const bar = document.getElementById('messageSearchInputBar');
    bar.style.display = bar.style.display === 'none' ? 'flex' : 'none';
    document.getElementById('searchMsgInput').value = '';
    this.searchQuery = '';
    document.getElementById('searchMsgInput').focus();
  },

  closeMessageSearch() {
    document.getElementById('messageSearchInputBar').style.display = 'none';
    document.getElementById('searchMsgInput').value = '';
    if (this.searchQuery) {
      this.searchQuery = '';
      this.loadMessages();
    }
  },

  searchMessages(q) {
    this.searchQuery = q.trim();
    this.loadMessages();
  },

  // Typing action
  handleInputKeyPress() {
    const now = Date.now();
    if (now - this.lastTypingSent > 2000) {
      this.lastTypingSent = now;
      API.post(`/chat/channels/${this.activeConvId}/typing/`, {}).catch(() => {});
    }
    const input = document.getElementById('msgInput');
    this.autoResize(input);
  },

  // Voice recording logic
  async toggleVoiceRecord() {
    if (this.isRecording) {
      this.stopVoiceRecord();
    } else {
      await this.startVoiceRecord();
    }
  },

  async startVoiceRecord() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      this.audioChunks = [];
      this.mediaRecorder = new MediaRecorder(stream);
      this.mediaRecorder.ondataavailable = (e) => this.audioChunks.push(e.data);
      this.mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(this.audioChunks, { type: 'audio/webm' });
        await this.sendVoiceMessage(audioBlob);
      };

      this.mediaRecorder.start();
      this.isRecording = true;
      this.recordDuration = 0;
      
      const input = document.getElementById('msgInput');
      input.disabled = true;
      document.getElementById('micBtn').style.color = '#DC2626';
      
      this.recordTimer = setInterval(() => {
        this.recordDuration++;
        const mins = Math.floor(this.recordDuration / 60);
        const secs = this.recordDuration % 60;
        input.value = `🎤 Ovoz yozilmoqda: ${mins}:${secs < 10 ? '0' : ''}${secs}... (to'xtatish uchun bosing)`;
      }, 1000);
      
    } catch(e) {
      window.toast?.show("Mikrofonni ulash imkoni bo'lmadi: " + e.message, 'error');
    }
  },

  stopVoiceRecord() {
    if (this.mediaRecorder && this.isRecording) {
      this.mediaRecorder.stop();
      this.mediaRecorder.stream.getTracks().forEach(track => track.stop());
      clearInterval(this.recordTimer);
      
      this.isRecording = false;
      const input = document.getElementById('msgInput');
      input.disabled = false;
      input.value = '';
      document.getElementById('micBtn').style.color = '#4A5568';
    }
  },

  async sendVoiceMessage(blob) {
    const fd = new FormData();
    fd.append('file', blob, 'voice.webm');
    fd.append('message_type', 'voice');
    fd.append('text', 'Ovozli xabar');

    try {
      await API.post(`/chat/channels/${this.activeConvId}/messages/`, fd);
      await this.loadMessages();
      await this.loadConversations();
    } catch (e) {
      window.toast?.show(e.message || 'Ovoz yuborilmadi', 'error');
    }
  },

  openCreateGroupModal() {
    document.getElementById('groupModal').style.display = 'flex';
  },

  async createGroup() {
    const name = document.getElementById('gName').value.trim();
    const description = document.getElementById('gDesc').value.trim();
    if (!name) {
      window.toast?.show("Guruh nomini yozing", 'error');
      return;
    }

    try {
      const res = await API.post('/chat/channels/', { name, description });
      document.getElementById('gName').value = '';
      document.getElementById('gDesc').value = '';
      document.getElementById('groupModal').style.display = 'none';
      window.toast?.show("Guruh yaratildi", 'success');
      await this.loadConversations();
      if (res.data?.id) {
        this.openConv(res.data.id);
      }
    } catch (e) {
      window.toast?.show(e.message, 'error');
    }
  },

  handleFileUpload(event) {
    const file = event.target.files[0];
    if (file) {
      this.selectedFile = file;
      document.getElementById('previewFileName').textContent = `📁 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
      document.getElementById('uploadPreview').style.display = 'flex';
    }
  },

  clearSelectedFile() {
    this.selectedFile = null;
    document.getElementById('fileInput').value = '';
    document.getElementById('uploadPreview').style.display = 'none';
  },

  renderMessages(messages) {
    this.lastMsgCount = messages.length;
    const el = document.getElementById('chatMessages');
    const me = this.currentUser;

    el.innerHTML = messages.map(m => {
      const isMine = m.sender_id === me?.id;
      const time = new Date(m.created_at).toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });
      
      let fileHtml = '';
      if (m.file && m.message_type === 'voice') {
        fileHtml = `<div style="margin-top:6px;"><audio src="${m.file}" controls style="max-width:100%; border-radius:8px; display:block;"></audio></div>`;
      } else if (m.file) {
        const isImage = m.file.match(/\.(jpeg|jpg|gif|png|webp)/i);
        if (isImage) {
          fileHtml = `<div style="margin-top:6px; max-width:200px;"><img src="${m.file}" style="width:100%; border-radius:8px; display:block; cursor:pointer;" onclick="window.open('${m.file}', '_blank'); event.stopPropagation();"></div>`;
        } else {
          fileHtml = `<div style="margin-top:6px;"><a href="${m.file}" target="_blank" onclick="event.stopPropagation();" style="color:${isMine ? '#fff' : 'var(--purple)'}; text-decoration:underline; font-size:12px; display:flex; align-items:center; gap:4px;"><i class="ti ti-download"></i> ${m.file_name || 'Faylni yuklash'}</a></div>`;
        }
      }

      // Render Polls
      let pollHtml = '';
      if (m.message_type === 'poll' && m.poll_data) {
        const poll = m.poll_data;
        const results = m.poll_results || {};
        const total = results.total_votes || 0;
        
        pollHtml = `
          <div style="background:var(--bg); border:1.5px solid var(--border); border-radius:12px; padding:12px; margin-top:8px; color:var(--text); width:280px; text-align:left;">
            <div style="font-weight:700; font-size:13px; margin-bottom:10px; display:flex; align-items:center; gap:6px;"><i class="ti ti-chart-bar" style="color:var(--purple); font-size:16px;"></i> ${this.escHtml(poll.question)}</div>
            <div>
              ${(poll.options || []).map(opt => {
                const count = results.counts?.[opt.id] || 0;
                const percent = total > 0 ? Math.round((count / total) * 100) : 0;
                const isMyVote = results.my_vote === opt.id;
                return `
                  <div onclick="ChatApp.votePoll(${m.id}, ${opt.id}); event.stopPropagation();" class="poll-option-row ${isMyVote ? 'voted' : ''}">
                    <div class="poll-option-progress" style="width: ${percent}%;"></div>
                    <div class="poll-option-content">
                      <span>${this.escHtml(opt.text)}</span>
                      <span>${percent}% (${count})</span>
                    </div>
                  </div>`;
              }).join('')}
            </div>
            <div style="font-size:10px; color:var(--text-3); margin-top:10px; text-align:right;">Jami ovozlar: ${total}</div>
          </div>`;
      }

      let reactsHtml = '';
      const reactions = m.reactions || {};
      Object.keys(reactions).forEach(emoji => {
        const users = reactions[emoji] || [];
        const hasReacted = users.some(u => u.user_id === me?.id);
        reactsHtml += `
          <span onclick="ChatApp.toggleReact(${m.id}, '${emoji}'); event.stopPropagation();" style="cursor:pointer; font-size:11px; padding:2px 6px; border-radius:8px; background:${hasReacted ? 'var(--purple-light)' : 'rgba(0,0,0,0.04)'}; border: 1px solid ${hasReacted ? 'var(--purple)' : 'transparent'}; margin-right:4px;">
            ${emoji} ${users.length}
          </span>`;
      });

      const avatarSrc = m.sender_avatar 
        ? `<img src="${m.sender_avatar}">` 
        : this.initials(m.sender_name);

      return `
        <div class="msg ${isMine ? 'mine' : 'theirs'}" id="msg-${m.id}" style="position:relative;">
          ${!isMine ? `<div class="msg-av" onclick="window.location.href='/profile.html?id=${m.sender_id}'">${avatarSrc}</div>` : ''}
          <div style="max-width: 65%;">
            <div class="msg-bubble" onclick="ChatApp.showContextMenu(event, ${m.id}, ${isMine}, '${m.text.replace(/'/g, "\\'")}')" style="max-width:100%;">
              ${!isMine ? `<span onclick="window.location.href='/profile.html?id=${m.sender_id}'; event.stopPropagation();" style="cursor:pointer; font-weight:700; color:var(--purple); display:block; margin-bottom:4px; font-size:11.5px;">${m.sender_name}</span>` : ''}
              ${m.message_type !== 'poll' ? `<div>${this.escHtml(m.text)}</div>` : ''}
              ${fileHtml}
              ${pollHtml}
              <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px; gap:8px;">
                <div class="msg-time" style="margin:0;">${time} ${m.is_edited ? '(tahrirlangan)' : ''}</div>
              </div>
            </div>
            <div class="reactions-container" style="margin-top:4px; display:flex; flex-wrap:wrap; gap:4px;">
              ${reactsHtml}
            </div>
          </div>
        </div>`;
    }).join('');
    el.scrollTop = el.scrollHeight;
  },

  showContextMenu(e, msgId, isMine, text) {
    e.preventDefault();
    e.stopPropagation();
    
    this.contextMenuTargetMsgId = msgId;
    this.contextMenuTargetMsgText = text;

    const menu = document.getElementById('messageContextMenu');
    menu.style.display = 'block';
    
    menu.style.left = `${Math.min(e.clientX, window.innerWidth - 200)}px`;
    menu.style.top = `${Math.min(e.clientY, window.innerHeight - 200)}px`;

    document.getElementById('menuEditOpt').style.display = isMine ? 'flex' : 'none';
    document.getElementById('menuDeleteOpt').style.display = isMine ? 'flex' : 'none';
  },

  async triggerMenuAction(action, data) {
    document.getElementById('messageContextMenu').style.display = 'none';
    const msgId = this.contextMenuTargetMsgId;

    if (action === 'react') {
      await this.toggleReact(msgId, data);
    } else if (action === 'reply') {
      this.openThread(msgId);
    } else if (action === 'pin') {
      try {
        await API.post(`/chat/channels/${this.activeConvId}/pin/`, { message_id: msgId });
        window.toast?.show("Xabar pin qilindi", 'success');
        await this.loadConversations();
        await this.openConv(this.activeConvId);
      } catch (e) {
        window.toast?.show(e.message, 'error');
      }
    } else if (action === 'edit') {
      this.enterEditMode(msgId, this.contextMenuTargetMsgText);
    } else if (action === 'delete') {
      if (confirm("Ushbu xabarni o'chirishni xohlaysizmi?")) {
        try {
          await API.delete(`/chat/messages/${msgId}/`);
          await this.loadMessages();
        } catch(e) {
          window.toast?.show(e.message, 'error');
        }
      }
    }
  },

  enterEditMode(msgId, text) {
    this.editingMsgId = msgId;
    const bar = document.getElementById('editModeBar');
    const preview = document.getElementById('editingTextPreview');
    const input = document.getElementById('msgInput');

    preview.textContent = text.length > 40 ? text.slice(0, 40) + '...' : text;
    bar.style.display = 'flex';
    input.value = text;
    input.focus();
    this.autoResize(input);
  },

  cancelEditMode() {
    this.editingMsgId = null;
    document.getElementById('editModeBar').style.display = 'none';
    document.getElementById('msgInput').value = '';
  },

  async toggleReact(msgId, emoji) {
    try {
      await API.post(`/chat/messages/${msgId}/react/`, { emoji });
      await this.loadMessages();
      if (this.activeThreadParentId === msgId) {
        await this.loadThreadReplies();
      }
    } catch (e) {
      window.toast?.show(e.message, 'error');
    }
  },

  async sendMessage() {
    const input = document.getElementById('msgInput');
    const content = input.value.trim();
    if (!content && !this.selectedFile) return;

    if (this.editingMsgId) {
      try {
        await API.patch(`/chat/messages/${this.editingMsgId}/`, { text: content });
        this.cancelEditMode();
        await this.loadMessages();
      } catch (e) {
        window.toast?.show(e.message || 'Xabar tahrirlanmadi', 'error');
      }
      return;
    }

    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    const formData = new FormData();
    if (content) formData.append('text', content);
    if (this.selectedFile) {
      formData.append('file', this.selectedFile);
      formData.append('message_type', this.selectedFile.type.startsWith('image/') ? 'image' : 'file');
    }

    this.clearSelectedFile();

    try {
      await API.post(`/chat/channels/${this.activeConvId}/messages/`, formData);
      await this.loadMessages();
      await this.loadConversations();
    } catch (e) {
      window.toast?.show(e.message || 'Xabar yuborilmadi', 'error');
    } finally {
      btn.disabled = false;
      input.focus();
    }
  },

  // --- POLLS ---
  openCreatePollModal() {
    document.getElementById('pollModal').style.display = 'flex';
    document.getElementById('pollQuestion').value = '';
    const container = document.getElementById('pollOptionsContainer');
    container.innerHTML = `
      <label style="font-size:11px; font-weight:700; display:block;">Variantlar</label>
      <input class="poll-opt-input" type="text" placeholder="1-variant" style="width:100%; padding:10px; border:2px solid var(--border); border-radius:10px; font-size:12px; outline:none; background:var(--bg);">
      <input class="poll-opt-input" type="text" placeholder="2-variant" style="width:100%; padding:10px; border:2px solid var(--border); border-radius:10px; font-size:12px; outline:none; background:var(--bg);">
    `;
  },

  addPollOptionField() {
    const container = document.getElementById('pollOptionsContainer');
    const idx = container.querySelectorAll('.poll-opt-input').length + 1;
    const input = document.createElement('input');
    input.className = 'poll-opt-input';
    input.type = 'text';
    input.placeholder = `${idx}-variant`;
    input.style.cssText = "width:100%; padding:10px; border:2px solid var(--border); border-radius:10px; font-size:12px; outline:none; background:var(--bg);";
    container.appendChild(input);
  },

  async submitPoll() {
    const q = document.getElementById('pollQuestion').value.trim();
    if (!q) {
      window.toast?.show("Savolni yozing", 'error');
      return;
    }

    const inputs = document.querySelectorAll('.poll-opt-input');
    const options = [];
    inputs.forEach((input, idx) => {
      const val = input.value.trim();
      if (val) {
        options.push({ id: idx, text: val });
      }
    });

    if (options.length < 2) {
      window.toast?.show("Kamida 2 ta variant bo'lishi kerak", 'error');
      return;
    }

    const pollData = JSON.stringify({ question: q, options });

    try {
      await API.post(`/chat/channels/${this.activeConvId}/messages/`, {
        text: pollData,
        message_type: 'poll'
      });
      document.getElementById('pollModal').style.display = 'none';
      await this.loadMessages();
    } catch(e) {
      window.toast?.show(e.message, 'error');
    }
  },

  async votePoll(msgId, optionId) {
    try {
      await API.post(`/chat/messages/${msgId}/vote/`, { option_id: optionId });
      await this.loadMessages();
    } catch(e) {
      window.toast?.show(e.message, 'error');
    }
  },

  // --- GROUP SETTINGS TABS ---
  currentSettingsTab: 'members',
  switchSettingsTab(tab) {
    this.currentSettingsTab = tab;
    document.getElementById('settingsTabMembersBtn').classList.toggle('active', tab === 'members');
    document.getElementById('settingsTabMediaBtn').classList.toggle('active', tab === 'media');
    
    document.getElementById('settingsTabMembers').style.display = tab === 'members' ? 'flex' : 'none';
    document.getElementById('settingsTabMedia').style.display = tab === 'media' ? 'block' : 'none';

    if (tab === 'media') {
      this.loadSharedMedia();
    }
  },

  async loadSharedMedia() {
    try {
      const res = await API.get(`/chat/channels/${this.activeConvId}/media/`);
      const media = res.data;

      // Render images
      const imgDiv = document.getElementById('sharedMediaImages');
      if (media.images && media.images.length > 0) {
        imgDiv.innerHTML = media.images.map(img => `
          <img src="${img.file}" onclick="window.open('${img.file}', '_blank')">
        `).join('');
      } else {
        imgDiv.innerHTML = '<div style="grid-column: span 3; font-size:11px; color:var(--text-3); text-align:center;">Rasm yo\'q</div>';
      }

      // Render files
      const fileDiv = document.getElementById('sharedMediaFiles');
      if (media.files && media.files.length > 0) {
        fileDiv.innerHTML = media.files.map(f => `
          <a href="${f.file}" target="_blank" class="shared-media-item">
            <i class="ti ti-file"></i> 
            <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${f.file_name || 'Fayl'}</span>
          </a>
        `).join('');
      } else {
        fileDiv.innerHTML = '<div style="font-size:11px; color:var(--text-3); text-align:center;">Fayllar yo\'q</div>';
      }

      // Render links
      const linkDiv = document.getElementById('sharedMediaLinks');
      if (media.links && media.links.length > 0) {
        linkDiv.innerHTML = media.links.map(l => `
          <a href="${l.text}" target="_blank" class="shared-media-item">
            <i class="ti ti-link"></i> 
            <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${l.text}</span>
          </a>
        `).join('');
      } else {
        linkDiv.innerHTML = '<div style="font-size:11px; color:var(--text-3); text-align:center;">Havolalar yo\'q</div>';
      }

    } catch (e) {
      console.error("Shared media yuklanmadi", e);
    }
  },

  // --- GROUP SETTINGS MEMBERS ---
  groupSettingsMembers: [],
  async openGroupSettings() {
    const conv = this.conversations.find(c => c.id === this.activeConvId);
    if (!conv || conv.channel_type === 'direct') return;

    this.switchSettingsTab('members'); // Reset to members tab on open

    try {
      const res = await API.get(`/chat/channels/${this.activeConvId}/detail/`);
      const data = res.data;

      document.getElementById('groupSettingsName').value = data.name || '';
      document.getElementById('groupSettingsDesc').value = data.description || '';
      
      const logoImg = document.getElementById('groupSettingsLogoImg');
      const logoInitials = document.getElementById('groupSettingsInitials');
      if (data.image) {
        logoImg.src = data.image;
        logoImg.style.display = 'block';
        logoInitials.style.display = 'none';
      } else {
        logoImg.style.display = 'none';
        logoInitials.style.display = 'block';
        logoInitials.textContent = this.initials(data.name);
      }

      const isUserAdmin = data.members.some(m => m.id === this.currentUser?.id && m.role === 'admin');
      
      document.getElementById('groupSettingsName').disabled = !isUserAdmin;
      document.getElementById('groupSettingsDesc').disabled = !isUserAdmin;
      document.getElementById('groupLogoInput').disabled = !isUserAdmin;
      document.getElementById('saveGroupBtn').style.display = isUserAdmin ? 'block' : 'none';
      document.getElementById('addMemberToggleBtn').style.display = isUserAdmin ? 'block' : 'none';
      document.getElementById('deleteGroupBtn').style.display = isUserAdmin ? 'block' : 'none';

      this.groupSettingsMembers = data.members || [];
      this.renderGroupSettingsMembers(isUserAdmin);

      document.getElementById('groupSettingsModal').style.display = 'flex';
    } catch (e) {
      window.toast?.show(e.message, 'error');
    }
  },

  renderGroupSettingsMembers(isAdmin) {
    const list = document.getElementById('groupSettingsMembersList');
    list.innerHTML = this.groupSettingsMembers.map(m => {
      const avatar = m.avatar ? `<img src="${m.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : this.initials(m.full_name);
      const isMe = m.id === this.currentUser?.id;
      const kickBtn = (isAdmin && !isMe) 
        ? `<button onclick="ChatApp.kickMember(${m.id})" style="background:transparent; border:none; color:#DC2626; font-size:11px; cursor:pointer; font-weight:600;"><i class="ti ti-user-minus"></i> Haydash</button>` 
        : '';
      return `
        <div style="display:flex; align-items:center; gap:10px; padding:6px 0;">
          <div style="width:30px; height:30px; border-radius:50%; background:var(--purple-light); color:var(--purple); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; overflow:hidden;">${avatar}</div>
          <div style="flex:1;">
            <div style="font-size:12.5px; font-weight:600;">${m.full_name} ${isMe ? ' (Siz)' : ''}</div>
            <div style="font-size:10px; color:var(--text-3);">${m.role === 'admin' ? 'Admin' : "A'zo"}</div>
          </div>
          ${kickBtn}
        </div>`;
    }).join('');
  },

  async kickMember(userId) {
    if (!confirm("Ushbu a'zoni guruhdan haydamoqchimisiz?")) return;
    try {
      await API.delete(`/chat/channels/${this.activeConvId}/members/${userId}/`);
      window.toast?.show("A'zo guruhdan chiqarildi", 'success');
      await this.openGroupSettings();
      await this.loadConversations();
    } catch (e) {
      window.toast?.show(e.message, 'error');
    }
  },

  showAddMemberForm(show) {
    document.getElementById('addMemberSection').style.display = show ? 'block' : 'none';
    document.getElementById('memberSearchInput').value = '';
    document.getElementById('memberSearchResults').innerHTML = '';
  },

  async searchUsersToAdd(q) {
    const val = q.trim();
    if (val.length < 2) {
      document.getElementById('memberSearchResults').innerHTML = '';
      return;
    }
    try {
      const res = await API.get(`/chat/users/search/?q=${encodeURIComponent(val)}`);
      const users = res.data || [];
      
      const resultsDiv = document.getElementById('memberSearchResults');
      if (!users.length) {
        resultsDiv.innerHTML = '<div style="font-size:11px; color:var(--text-3); text-align:center;">Topilmadi</div>';
        return;
      }

      resultsDiv.innerHTML = users.map(u => {
        const exists = this.groupSettingsMembers.some(m => m.id === u.id);
        if (exists) return '';

        return `
          <div style="display:flex; align-items:center; justify-content:space-between; background:white; padding:6px 10px; border-radius:8px; border:1px solid var(--border);">
            <span style="font-size:12px; font-weight:600;">${u.full_name}</span>
            <button onclick="ChatApp.addMemberToGroup(${u.id})" class="btn-primary" style="padding:2px 8px; font-size:10px; border-radius:6px; background:var(--purple); color:white; border:none; cursor:pointer;"><i class="ti ti-plus"></i></button>
          </div>`;
      }).join('');
    } catch (e) {
      console.error(e);
    }
  },

  async addMemberToGroup(userId) {
    try {
      await API.post(`/chat/channels/${this.activeConvId}/members/`, { user_id: userId });
      window.toast?.show("A'zo muvaffaqiyatli qo'shildi", 'success');
      this.showAddMemberForm(false);
      await this.openGroupSettings();
      await this.loadConversations();
    } catch (e) {
      window.toast?.show(e.message, 'error');
    }
  },

  uploadedGroupLogoFile: null,
  handleGroupLogoUpload(event) {
    const file = event.target.files[0];
    if (file) {
      this.uploadedGroupLogoFile = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        const logoImg = document.getElementById('groupSettingsLogoImg');
        logoImg.src = e.target.result;
        logoImg.style.display = 'block';
        document.getElementById('groupSettingsInitials').style.display = 'none';
      };
      reader.readAsDataURL(file);
    }
  },

  async saveGroupInfo() {
    const name = document.getElementById('groupSettingsName').value.trim();
    const description = document.getElementById('groupSettingsDesc').value.trim();
    if (!name) {
      window.toast?.show("Guruh nomini yozing", 'error');
      return;
    }

    const fd = new FormData();
    fd.append('name', name);
    fd.append('description', description);
    if (this.uploadedGroupLogoFile) {
      fd.append('image', this.uploadedGroupLogoFile);
    }

    try {
      await API.patch(`/chat/channels/${this.activeConvId}/detail/`, fd);
      window.toast?.show("Guruh ma'lumotlari yangilandi", 'success');
      this.uploadedGroupLogoFile = null;
      document.getElementById('groupSettingsModal').style.display = 'none';
      await this.loadConversations();
      await this.openConv(this.activeConvId);
    } catch(e) {
      window.toast?.show(e.message, 'error');
    }
  },

  async deleteGroup() {
    if (!confirm("Haqiqatdan ham ushbu guruhni o'chirib yubormoqchimisiz?")) return;
    try {
      await API.delete(`/chat/channels/${this.activeConvId}/detail/`);
      window.toast?.show("Guruh o'chirildi", 'success');
      document.getElementById('groupSettingsModal').style.display = 'none';
      document.getElementById('chatActive').style.display = 'none';
      document.getElementById('chatPlaceholder').style.display = 'flex';
      this.activeConvId = null;
      await this.loadConversations();
    } catch(e) {
      window.toast?.show(e.message, 'error');
    }
  },

  // --- THREAD / JAVOB ZANJIRI ---
  async openThread(msgId) {
    this.activeThreadParentId = msgId;
    document.getElementById('threadPanel').style.display = 'flex';
    await this.loadThreadReplies();
  },

  closeThread() {
    this.activeThreadParentId = null;
    document.getElementById('threadPanel').style.display = 'none';
  },

  async loadThreadReplies() {
    if (!this.activeThreadParentId) return;
    const contentEl = document.getElementById('threadContent');
    contentEl.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';

    try {
      const res = await API.get(`/chat/channels/${this.activeConvId}/messages/?parent=${this.activeThreadParentId}`);
      const replies = res.data || [];
      
      const channelMsgsRes = await API.get(`/chat/channels/${this.activeConvId}/messages/`);
      const parentMsg = (channelMsgsRes.data || []).find(m => m.id === this.activeThreadParentId);

      let parentHtml = '';
      if (parentMsg) {
        parentHtml = `
          <div style="padding:12px; background:var(--purple-light); border-radius:12px; margin-bottom:16px;">
            <div style="font-weight:700; font-size:12px; color:var(--purple);">${parentMsg.sender_name}</div>
            <div style="font-size:13px; color:var(--text); margin-top:4px;">${parentMsg.text}</div>
          </div>
          <div style="font-weight:700; font-size:11px; color:var(--text-2); border-bottom:1px solid var(--border); padding-bottom:6px; margin-bottom:8px;">Javoblar</div>`;
      }

      contentEl.innerHTML = parentHtml + replies.map(r => {
        const isMine = r.sender_id === this.currentUser?.id;
        const time = new Date(r.created_at).toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });
        return `
          <div style="display:flex; gap:10px; align-items:flex-start;">
            <div style="width:24px; height:24px; border-radius:50%; background:var(--purple-light); color:var(--purple); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; overflow:hidden;">
              ${r.sender_avatar ? `<img src="${r.sender_avatar}" style="width:100%;height:100%;object-fit:cover;">` : this.initials(r.sender_name)}
            </div>
            <div style="flex:1;">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-weight:700; font-size:12px;">${r.sender_name}</span>
                <span style="font-size:10px; color:var(--text-3);">${time}</span>
              </div>
              <div style="font-size:12.5px; color:var(--text-2); margin-top:2px;">${this.escHtml(r.text)}</div>
            </div>
          </div>`;
      }).join('');
      contentEl.scrollTop = contentEl.scrollHeight;

    } catch (e) {
      contentEl.innerHTML = `<div style="font-size:12px; color:red; padding:12px;">Xato: ${e.message}</div>`;
    }
  },

  async sendThreadMessage() {
    const input = document.getElementById('threadMsgInput');
    const text = input.value.trim();
    if (!text || !this.activeThreadParentId) return;

    const btn = document.getElementById('threadSendBtn');
    btn.disabled = true;
    input.value = '';

    try {
      await API.post(`/chat/channels/${this.activeConvId}/messages/`, {
        text,
        parent: this.activeThreadParentId
      });
      await this.loadThreadReplies();
      await this.loadMessages();
    } catch (e) {
      window.toast?.show(e.message, 'error');
    } finally {
      btn.disabled = false;
      input.focus();
    }
  },

  handleThreadKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      this.sendThreadMessage();
    }
  },

  handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      this.sendMessage();
    }
  },

  autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  },

  initials(name) {
    if (!name) return '?';
    const parts = name.trim().split(' ');
    return parts.length >= 2
      ? (parts[0][0] + parts[1][0]).toUpperCase()
      : name.slice(0, 2).toUpperCase();
  },

  escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
  },
};

document.addEventListener('DOMContentLoaded', () => ChatApp.init());
</script>
</body>
</html>
