<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat — MUTP</title>
  <meta name="description" content="MUTP platformasi — ustoz va o'quvchilar o'rtasidagi chat">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F8F8F7;
      --surface: #FFFFFF;
      --border: rgba(0,0,0,0.08);
      --border-md: rgba(0,0,0,0.12);
      --text: #1A1A18;
      --text-2: #6B6B67;
      --text-3: #A0A09A;
      --purple: #534AB7;
      --purple-light: #EEEDFE;
      --green: #0F6E56;
      --green-light: #E1F5EE;
      --duo-green: #58CC02;
      --duo-green-dark: #46A302;
      --duo-green-bg: #D7FFB8;
      --amber: #854F0B;
      --amber-light: #FAEEDA;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

    /* Layout */
    .chat-app { display: flex; height: 100vh; }

    /* Sidebar */
    .chat-sidebar { width: 300px; background: var(--surface); border-right: 2px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .chat-sidebar-head { padding: 16px 20px; border-bottom: 2px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .chat-sidebar-title { font-size: 15px; font-weight: 700; }
    .btn-back { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); text-decoration: none; border: 2px solid var(--border-md); border-radius: 10px; padding: 5px 10px; transition: background .15s; }
    .btn-back:hover { background: var(--bg); color: var(--text); }
    .conv-search { padding: 12px 16px; border-bottom: 2px solid var(--border); }
    .conv-search input { width: 100%; padding: 8px 12px; border: 2px solid var(--border); border-radius: 12px; font-size: 13px; background: var(--bg); outline: none; transition: border .15s; }
    .conv-search input:focus { border-color: var(--purple); }
    .conv-list { flex: 1; overflow-y: auto; }
    .conv-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background .15s; position: relative; }
    .conv-item:hover { background: var(--bg); }
    .conv-item.active { background: var(--purple-light); }
    .conv-av { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; background: var(--purple-light); color: var(--purple); }
    .conv-av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .conv-info { flex: 1; min-width: 0; }
    .conv-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-last { font-size: 11px; color: var(--text-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-badge { background: var(--purple); color: #fff; border-radius: 99px; font-size: 10px; font-weight: 700; padding: 2px 6px; flex-shrink: 0; }
    .conv-empty { padding: 32px 20px; text-align: center; color: var(--text-2); font-size: 13px; }

    /* Main chat area */
    .chat-main { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
    .chat-header { background: var(--surface); border-bottom: 2px solid var(--border); padding: 0 20px; height: 56px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .chat-header-av { width: 36px; height: 36px; border-radius: 50%; background: var(--purple-light); color: var(--purple); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
    .chat-header-av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .chat-header-name { font-size: 15px; font-weight: 700; }
    .chat-header-role { font-size: 11px; color: var(--text-2); margin-top: 1px; }
    .chat-placeholder { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--text-2); }
    .chat-placeholder i { font-size: 48px; opacity: .3; }
    .chat-placeholder p { font-size: 14px; }

    /* Messages */
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { display: flex; align-items: flex-end; gap: 8px; animation: msgIn .2s ease; }
    @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .msg.mine { flex-direction: row-reverse; }
    .msg-av { width: 28px; height: 28px; border-radius: 50%; background: var(--purple-light); color: var(--purple); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; flex-shrink: 0; }
    .msg-bubble { max-width: 65%; padding: 10px 14px; border-radius: 16px; font-size: 13px; line-height: 1.5; }
    .msg.theirs .msg-bubble { background: var(--surface); border: 2px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.mine .msg-bubble { background: var(--purple); color: #fff; border-bottom-right-radius: 4px; }
    .msg-time { font-size: 10px; color: var(--text-3); margin-top: 4px; text-align: right; }
    .msg.theirs .msg-time { text-align: left; }

    /* Input */
    .chat-input-bar { background: var(--surface); border-top: 2px solid var(--border); padding: 14px 20px; display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
    .chat-input-bar textarea { flex: 1; border: 2px solid var(--border); border-radius: 14px; padding: 10px 14px; font-size: 13px; font-family: inherit; resize: none; outline: none; max-height: 120px; overflow-y: auto; transition: border .15s; background: var(--bg); }
    .chat-input-bar textarea:focus { border-color: var(--purple); }
    .btn-send { background: var(--duo-green); color: #fff; border: none; border-radius: 14px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; box-shadow: 0 4px 0 var(--duo-green-dark); transition: transform .1s, box-shadow .1s; flex-shrink: 0; }
    .btn-send:hover { background: var(--duo-green-dark); transform: translateY(2px); box-shadow: 0 2px 0 var(--duo-green-dark); }
    .btn-send:disabled { opacity: .5; cursor: not-allowed; }

    /* Loading */
    .loading-dots { display: flex; gap: 4px; align-items: center; padding: 16px 20px; }
    .loading-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--purple); animation: bounce .8s infinite; }
    .loading-dots span:nth-child(2) { animation-delay: .15s; }
    .loading-dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

    /* Toast */
    #toast-container { position: fixed; top: 16px; right: 16px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }

    @media (max-width: 700px) {
      .chat-sidebar { width: 100%; position: absolute; z-index: 10; height: 100%; transform: translateX(0); transition: transform .25s; }
      .chat-sidebar.hidden { transform: translateX(-100%); }
      .chat-main { width: 100%; }
    }
  </style>
</head>
<body>
<div id="toast-container"></div>
<div class="chat-app">

  <!-- Sidebar: Suhbatlar -->
  <aside class="chat-sidebar" id="chatSidebar">
    <div class="chat-sidebar-head">
      <span class="chat-sidebar-title">💬 Xabarlar</span>
      <a href="javascript:history.back()" class="btn-back"><i class="ti ti-arrow-left"></i> Orqaga</a>
    </div>
    <div class="conv-search">
      <input id="convSearch" type="text" placeholder="Qidirish..." oninput="ChatApp.filterConvs(this.value)">
    </div>
    <div class="conv-list" id="convList">
      <div class="conv-empty">Yuklanmoqda...</div>
    </div>
  </aside>

  <!-- Main -->
  <div class="chat-main" id="chatMain">

    <!-- Placeholder (hech qaysi suhbat tanlanmagan) -->
    <div class="chat-placeholder" id="chatPlaceholder">
      <i class="ti ti-messages"></i>
      <p>Suhbat tanlang</p>
    </div>

    <!-- Active conversation -->
    <div id="chatActive" style="display:none; flex-direction:column; height:100%;">
      <div class="chat-header" id="chatHeader">
        <div class="chat-header-av" id="headerAv">?</div>
        <div>
          <div class="chat-header-name" id="headerName">—</div>
          <div class="chat-header-role" id="headerRole"></div>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-bar">
        <textarea id="msgInput" rows="1" placeholder="Xabar yozing..." oninput="ChatApp.autoResize(this)" onkeydown="ChatApp.handleKey(event)"></textarea>
        <button class="btn-send" id="sendBtn" onclick="ChatApp.sendMessage()" title="Yuborish">
          <i class="ti ti-send"></i>
        </button>
      </div>
    </div>

  </div>
</div>

<script src="assets/js/toast.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script>
const ChatApp = {
  conversations: [],
  activeConvId: null,
  pollTimer: null,
  currentUser: null,

  async init() {
    if (!App.requireAuth(['teacher', 'student'])) return;
    App.updateNav();
    this.currentUser = App.getUser();
    await this.loadConversations();
    // Auto-open if ?conv=ID or ?channel=ID or ?user=ID in URL
    const params = new URLSearchParams(location.search);
    if (params.get('conv')) this.openConv(parseInt(params.get('conv')));
    else if (params.get('channel')) this.openConv(parseInt(params.get('channel')));
    else if (params.get('user')) await this.startOrOpenConv(parseInt(params.get('user')));
  },

  async loadConversations() {
    try {
      const res = await API.get('/chat/channels/');
      this.conversations = res.data || [];
      this.renderConvList(this.conversations);
    } catch (e) {
      document.getElementById('convList').innerHTML = `<div class="conv-empty">Yuklanmadi: ${e.message}</div>`;
    }
  },

  renderConvList(convs) {
    const el = document.getElementById('convList');
    if (!convs.length) {
      el.innerHTML = '<div class="conv-empty">Hali suhbat yo\'q</div>';
      return;
    }
    el.innerHTML = convs.map(c => {
      const isDirect = c.channel_type === 'direct';
      const displayName = isDirect ? (c.other_user?.full_name || 'Shaxsiy chat') : c.name;
      const initials = this.initials(displayName);
      const lastMsg = c.last_message?.text || '';
      const unread = c.unread_count || 0;
      return `
        <div class="conv-item ${this.activeConvId === c.id ? 'active' : ''}" id="conv-${c.id}" onclick="ChatApp.openConv(${c.id})">
          <div class="conv-av">${initials}</div>
          <div class="conv-info">
            <div class="conv-name">${displayName}</div>
            <div class="conv-last">${lastMsg ? (lastMsg.length > 35 ? lastMsg.slice(0, 35) + '…' : lastMsg) : 'Hali xabar yo\'q'}</div>
          </div>
          ${unread ? `<span class="conv-badge">${unread}</span>` : ''}
        </div>`;
    }).join('');
  },

  filterConvs(q) {
    const filtered = this.conversations.filter(c => {
      const isDirect = c.channel_type === 'direct';
      const displayName = isDirect ? (c.other_user?.full_name || '') : c.name;
      return displayName.toLowerCase().includes(q.toLowerCase());
    });
    this.renderConvList(filtered);
  },

  async openConv(convId) {
    this.activeConvId = convId;
    document.getElementById('chatPlaceholder').style.display = 'none';
    const activeEl = document.getElementById('chatActive');
    activeEl.style.display = 'flex';

    // Mark active in sidebar
    document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
    const convEl = document.getElementById(`conv-${convId}`);
    if (convEl) convEl.classList.add('active');

    // Find conv data
    const conv = this.conversations.find(c => c.id === convId);
    if (conv) {
      const isDirect = conv.channel_type === 'direct';
      const displayName = isDirect ? (conv.other_user?.full_name || 'Shaxsiy chat') : conv.name;
      document.getElementById('headerAv').textContent = this.initials(displayName);
      document.getElementById('headerName').textContent = displayName;
      document.getElementById('headerRole').textContent = isDirect ? (conv.other_user?.role === 'teacher' ? 'Ustoz' : "O'quvchi") : "Guruh";
    }

    await this.loadMessages();
    clearInterval(this.pollTimer);
    this.pollTimer = setInterval(() => this.pollMessages(), 3000);
  },

  async startOrOpenConv(userId) {
    try {
      const res = await API.post(`/chat/direct/${userId}/`, {});
      const channelId = res.data?.channel_id;
      if (channelId) {
        await this.loadConversations();
        this.openConv(channelId);
      }
    } catch (e) {
      window.toast?.show(e.message || 'Xatolik', 'error');
    }
  },

  async loadMessages() {
    if (!this.activeConvId) return;
    const el = document.getElementById('chatMessages');
    el.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
    try {
      const res = await API.get(`/chat/channels/${this.activeConvId}/messages/`);
      this.renderMessages(res.data || []);
    } catch (e) {
      el.innerHTML = `<div style="padding:20px;color:var(--text-2)">Yuklanmadi: ${e.message}</div>`;
    }
  },

  lastMsgCount: 0,
  async pollMessages() {
    if (!this.activeConvId) return;
    try {
      const res = await API.get(`/chat/channels/${this.activeConvId}/messages/`);
      const msgs = res.data || [];
      if (msgs.length !== this.lastMsgCount) {
        this.renderMessages(msgs);
      }
    } catch {}
  },

  renderMessages(messages) {
    this.lastMsgCount = messages.length;
    const el = document.getElementById('chatMessages');
    const me = this.currentUser;
    el.innerHTML = messages.map(m => {
      const isMine = m.sender_id === me?.id;
      const time = new Date(m.created_at).toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });
      return `
        <div class="msg ${isMine ? 'mine' : 'theirs'}">
          ${!isMine ? `<div class="msg-av">${this.initials(m.sender_name)}</div>` : ''}
          <div>
            <div class="msg-bubble">${this.escHtml(m.text)}</div>
            <div class="msg-time">${time}</div>
          </div>
        </div>`;
    }).join('');
    el.scrollTop = el.scrollHeight;
  },

  async sendMessage() {
    const input = document.getElementById('msgInput');
    const content = input.value.trim();
    if (!content || !this.activeConvId) return;

    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    input.value = '';
    input.style.height = 'auto';

    // Optimistic render
    const el = document.getElementById('chatMessages');
    const time = new Date().toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });
    el.insertAdjacentHTML('beforeend', `
      <div class="msg mine" style="opacity:.6">
        <div>
          <div class="msg-bubble">${this.escHtml(content)}</div>
          <div class="msg-time">${time}</div>
        </div>
      </div>`);
    el.scrollTop = el.scrollHeight;

    try {
      await API.post(`/chat/channels/${this.activeConvId}/messages/`, { text: content });
      await this.loadMessages();
      await this.loadConversations();
    } catch (e) {
      window.toast?.show(e.message || 'Xabar yuborilmadi', 'error');
    } finally {
      btn.disabled = false;
      input.focus();
    }
  },

  handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      this.sendMessage();
    }
  },

  autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  },

  initials(name) {
    if (!name) return '?';
    const parts = name.trim().split(' ');
    return parts.length >= 2
      ? (parts[0][0] + parts[1][0]).toUpperCase()
      : name.slice(0, 2).toUpperCase();
  },

  escHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
  },
};

document.addEventListener('DOMContentLoaded', () => ChatApp.init());
</script>
</body>
</html>
